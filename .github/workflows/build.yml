# .github/workflows/build.yml  
name: Build  
  
on:  
  push:  
    branches: [ fix-modinfo ]  
  pull_request:  
    branches: [ fix-modinfo ]  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: ubuntu-latest  
  
    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  
        with:  
          fetch-depth: 0  # gradleutils.version 需要完整 git 历史来计算版本号  
  
      - name: Set up JDK 21  
        uses: actions/setup-java@v4  
        with:  
          java-version: '21'  
          distribution: 'temurin'  
  
      - name: Setup Gradle  
        uses: gradle/actions/setup-gradle@v4  
  
      - name: Grant execute permission for gradlew  
        run: chmod +x gradlew  
  
      - name: Build  
        run: ./gradlew :loader:jar  
  
      - name: Upload loader JAR  
        uses: actions/upload-artifact@v4  
        with:  
          name: FancyModLoader-loader  
          path: loader/build/libs/*.jar  
          if-no-files-found: error